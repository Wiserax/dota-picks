<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="Тренажёр пиков Dota 2: каждый вердикт со статистикой, патч, брекет, число игр и источник.">
  <title>Тренажёр пиков Dota 2</title>

    <nav class="tabs" id="tabs">

</html>
